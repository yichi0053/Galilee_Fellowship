# 架構書 §5.3 / OPERATIONS.md 第 3 節
# Supabase 免費方案連續 7 天無資料庫請求即自動暫停。
# 一旦暫停，成員下次開啟看到錯誤頁，18 週的活動就此結束。此 workflow 不可停用。
name: Keepalive

on:
  schedule:
    # 每兩天 UTC 03:00（台灣時間 11:00）。7 天的容忍度下，兩天間隔留有三次失敗的餘裕。
    - cron: '0 3 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::缺少 SUPABASE_URL 或 SUPABASE_ANON_KEY secret，見 docs/SETUP.md 第 4 節"
            exit 1
          fi

          # 打 rooms_public（anon 可讀的 view），這會實際觸及資料庫而非只碰 CDN。
          status=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/rooms_public?select=id&limit=1")

          echo "HTTP ${status}"
          cat /tmp/body.txt

          if [ "${status}" != "200" ]; then
            echo "::error::Keepalive 失敗，專案可能已暫停或 grants 未設定（架構書 §5.3）"
            exit 1
          fi

      # GitHub 會停用「repo 連續 60 天沒有活動」的 scheduled workflow，只寄一封通知信。
      # 學期是 126 天，功能寫完之後很可能好幾個月不會有 commit——
      # 於是第 60 天排程被停、第 67 天 Supabase 因無活動而暫停，成員看到錯誤頁。
      # 兩層失效環環相扣，而且每一層都是安靜的。這一步讓 repo 自己保持活著。
      - name: 讓 repo 保持活動（防 GitHub 60 天停用排程）
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "距離上次 commit ${age_days} 天"

          # 50 天才動手，留 10 天餘裕，也避免每兩天就製造一筆雜訊。
          if [ "${age_days}" -lt 50 ]; then
            echo "還不需要"
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/keepalive-stamp
          git add .github/keepalive-stamp
          git commit -m '維持 repo 活動，避免 GitHub 停用 keepalive 排程'
          git push
